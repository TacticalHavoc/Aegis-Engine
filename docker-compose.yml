services:
  agentic-soc:
    build: ./agentic-soc
    container_name: aegis-agentic-soc
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.5-flash-lite}
  dashboard:
    build: ./dashboard
    container_name: siem-dashboard
    restart: unless-stopped
    depends_on:
      - kafka
      - normalizer
    ports:
      - "8501:80"
  normalizer:
    build: ./normalizer
    container_name: siem-normalizer
    restart: unless-stopped
    depends_on:
      - kafka

  rule-engine:
    build: ./rule-engine
    container_name: siem-rule-engine
    restart: unless-stopped
    depends_on:
      - kafka
      - normalizer
    environment:
      KAFKA_SERVER: kafka:29092
  backend:
    build: ./backend
    container_name: aegis-backend
    restart: unless-stopped
    depends_on:
      - kafka
      - normalizer
      - rule-engine
      - agentic-soc
    ports:
      - "8001:8001"
    environment:
      KAFKA_SERVER: kafka:29092
      AGENTIC_SOC_URL: http://agentic-soc:8000
  kafka:
    image: apache/kafka:4.3.1
    container_name: siem-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"
      - "9093:9093"

    volumes:
      - kafka-data:/tmp/kraft-combined-logs

    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://10.26.139.199:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168

volumes:
  kafka-data:
